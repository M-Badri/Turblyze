name: CI Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            libeigen3-dev \
            libopenmpi-dev \
            openmpi-bin \
            petsc-dev \
            libmetis-dev \
            libhdf5-openmpi-dev \
            catch2

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew unlink hdf5 2>/dev/null || true
          HOMEBREW_NO_AUTO_UPDATE=1 brew install \
            pkg-config \
            eigen \
            open-mpi \
            petsc \
            metis \
            hdf5-mpi \
            catch2

      - name: Configure CMake
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DTURBLYZE_NATIVE_ARCH=ON

      - name: Build Solver and Test Targets
        run: cmake --build build -j

      - name: Run CTest Suite (Serial & MPI)
        # Allows MPI to oversubscribe cores on 2-vCPU GitHub runners
        env:
          OMPI_MCA_rmaps_base_oversubscribe: "true"
          PRTE_MCA_rmaps_default_mapping_policy: ":oversubscribe"
        run: |
          ctest --test-dir build \
            --output-on-failure \
            -LE regression

  windows-wsl:
    name: windows-latest (WSL2 Ubuntu)
    runs-on: windows-latest
    defaults:
      run:
        shell: wsl-bash {0}

    steps:
      - name: Set up WSL (Ubuntu 24.04)
        uses: Vampire/setup-wsl@v7
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          update: true
          additional-packages: >
            build-essential
            cmake
            pkg-config
            libeigen3-dev
            libopenmpi-dev
            openmpi-bin
            petsc-dev
            libmetis-dev
            libhdf5-openmpi-dev
            catch2

      - name: Check out repository
        uses: actions/checkout@v5

      - name: Ensure Unix line endings for shell scripts
        run: |
          sed -i 's/\r$//' tests/probe/checkAbort.sh tests/regression/checkRegression.sh
          chmod +x tests/probe/checkAbort.sh tests/regression/checkRegression.sh

      - name: Configure CMake
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DTURBLYZE_NATIVE_ARCH=ON

      - name: Build Solver and Test Targets
        run: cmake --build build -j

      - name: Run CTest Suite (Serial & MPI)
        run: |
          export OMPI_ALLOW_RUN_AS_ROOT=1
          export OMPI_ALLOW_RUN_AS_ROOT_CONFIRM=1
          export PRTE_ALLOW_RUN_AS_ROOT=1
          export PRTE_ALLOW_RUN_AS_ROOT_CONFIRM=1
          export OMPI_MCA_rmaps_base_oversubscribe=true
          export PRTE_MCA_rmaps_default_mapping_policy=:oversubscribe
          ctest --test-dir build \
            --output-on-failure \
            -LE regression