name: CI Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            libeigen3-dev \
            libopenmpi-dev \
            openmpi-bin \
            petsc-dev \
            libmetis-dev \
            libhdf5-openmpi-dev \
            catch2

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew unlink hdf5 2>/dev/null || true
          HOMEBREW_NO_AUTO_UPDATE=1 brew install \
            pkg-config \
            eigen \
            open-mpi \
            petsc \
            metis \
            hdf5-mpi \
            catch2

      - name: Configure CMake
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DTURBLYZE_NATIVE_ARCH=OFF

      - name: Build Solver and Test Targets
        run: cmake --build build -j

      - name: Run CTest Suite (Serial & MPI)
        # Allows MPI to oversubscribe cores on 2-vCPU GitHub runners
        env:
          OMPI_MCA_rmaps_base_oversubscribe: "true"
          PRTE_MCA_rmaps_default_mapping_policy: ":oversubscribe"
        run: |
          ctest --test-dir build \
            --output-on-failure \
            -LE regression